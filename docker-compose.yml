# 一键启动：docker-compose up -d
# 一键停止：docker-compose down
#
# 注意：前端需先构建一次，否则 Caddy 挂载的 dist 为空 → cd frontend && npm run build

version: "3.8"

services:
  # ── Caddy 反代 + 自动 HTTPS ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend/dist:/app/frontend/dist:ro
      - caddy_logs:/var/log/caddy

  # ── 后端 ──
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - TRUST_PROXY=true   # 只经 Caddy 反代可达，XFF 可信
    volumes:
      - ./backend/logs:/app/logs              # 日志持久化
      - ./backend/demos:/app/demos            # demo HTML 持久化
      - ./backend/data:/app/data              # SQLite（预留）
      - ./backend/chroma_data:/app/chroma_data # ChromaDB 持久化（vector_store 写 ./chroma_data）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Redis ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  redis_data:
