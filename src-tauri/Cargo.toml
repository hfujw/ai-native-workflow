[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — 给 LLM 装可插拔 skill 的 AI 原生工作台"
authors = ["Os"]
edition = "2021"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
