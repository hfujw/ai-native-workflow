<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Lumen — 给 LLM 装可插拔 skill 的 AI 原生工作台：输入主题，LLM 自主编排生成交互式知识网页，全程透明可迭代。"
      data-i18n-meta="description"
    />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/brand/lumen.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/brand/lumen.svg" />
    <link rel="apple-touch-icon" href="/brand/lumen.svg" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #1a1a1a;
        color: #fafafa;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("Lumen-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <title>Lumen</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading Lumen…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "Lumen.locale";
        var copy = {
          en: {
            boot: "Loading Lumen…",
            description: "Lumen — AI-native workspace with pluggable skills."
          },
          "zh-CN": {
            boot: "正在加载 Lumen…",
            description: "Lumen —— 给 LLM 装可插拔 skill 的 AI 原生工作台。"
          },
          "zh-TW": {
            boot: "正在載入 Lumen…",
            description: "Lumen —— 給 LLM 裝可插拔 skill 的 AI 原生工作臺。"
          },
          fr: {
            boot: "Chargement de Lumen…",
            description: "Lumen — espace de travail IA-native avec skills enfichables."
          },
          ja: {
            boot: "Lumen を読み込み中…",
            description: "Lumen — プラグ可能なスキルを持つ AI ネイティブワークスペース。"
          },
          ko: {
            boot: "Lumen 불러오는 중…",
            description: "Lumen — 플러그형 스킬을 갖춘 AI 네이티브 워크스페이스."
          },
          es: {
            boot: "Cargando Lumen…",
            description: "Lumen — espacio de trabajo IA-nativo con skills enchufables."
          },
          "pt-BR": {
            boot: "Carregando Lumen…",
            description: "Lumen — espaço de trabalho IA-nativo com skills plugáveis."
          },
          vi: {
            boot: "Đang tải Lumen…",
            description: "Lumen — không gian làm việc AI gốc với skills cắm được."
          },
          id: {
            boot: "Memuat Lumen…",
            description: "Lumen — ruang kerja AI-native dengan skill pluggable."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
