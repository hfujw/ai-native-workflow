<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>信息图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#eef0f6;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:48px 32px}
.head{border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:24px;margin-bottom:32px}
.kicker{font-size:12px;color:#5eead4;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:36px;margin-top:8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:32px 0}
.metric{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px}
.metric .v{font-size:34px;font-weight:800;color:#5eead4;font-variant-numeric:tabular-nums}
.metric .l{font-size:13px;color:#9aa3b5;margin-top:4px}
.sec{margin:36px 0}
h2{font-size:20px;margin-bottom:16px;color:#5eead4}
.bar{display:flex;align-items:center;gap:12px;margin:10px 0}
.bar .name{width:110px;flex:none;font-size:13px;color:#c3cadb;text-align:right}
.bar .track{flex:1;background:rgba(255,255,255,.07);border-radius:4px;height:18px}
.bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2dd4bf,#3b82f6)}
.bar .val{width:60px;font-size:13px;color:#5eead4;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px}
.card .n{font-size:28px;font-weight:800;color:#fbbf24}
.card .t{font-size:13px;color:#9aa3b5;margin-top:6px}
.foot{font-size:12px;color:#6b7280;border-top:1px solid rgba(255,255,255,.08);margin-top:48px;padding-top:16px}
</style></head>
<body>
<div class="wrap">
  <div class="head"><div class="kicker">数据专题</div><h1>大标题</h1></div>
  <div class="metrics"><div class="metric"><div class="v">数字</div><div class="l">标签</div></div></div>
  <div class="sec"><h2>对比标题</h2>
    <div class="bar"><span class="name">类别</span><div class="track"><div class="fill" style="width:75%"></div></div><span class="val">75%</span></div>
  </div>
  <div class="sec"><h2>要点标题</h2>
    <div class="grid"><div class="card"><div class="n">数字</div><div class="t">说明</div></div></div>
  </div>
  <div class="foot">数据来源与说明</div>
</div>
</body></html>
