<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>像素风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated}
body{background:#14101f;color:#e8e6f0;font-family:'Courier New',monospace;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:40px 24px;border:4px solid #3a3550;border-top:none;border-bottom:none}
.hud{display:flex;justify-content:space-between;font-size:12px;color:#8b84a8;border-bottom:2px solid #3a3550;padding-bottom:8px;margin-bottom:24px}
h1{font-size:32px;color:#ffd166;text-shadow:3px 3px 0 #7c3aed;margin:16px 0}
.sub{color:#8b84a8;font-size:14px;margin-bottom:24px}
.box{border:2px solid #3a3550;background:#1c1830;padding:16px;margin:16px 0}
.box .tag{display:inline-block;background:#7c3aed;color:#fff;font-size:11px;padding:2px 8px;letter-spacing:.1em;margin-bottom:8px}
p{margin-bottom:12px}
.stat{display:flex;justify-content:space-between;border-top:2px dashed #3a3550;padding-top:8px;margin-top:12px;font-size:13px}
.stat .v{color:#ffd166}
.foot{border-top:2px solid #3a3550;margin-top:32px;padding-top:12px;font-size:11px;color:#8b84a8;display:flex;justify-content:space-between}
</style></head>
<body>
<div class="wrap">
  <div class="hud"><span>时间</span><span>关卡</span></div>
  <h1>大标题</h1>
  <p class="sub">副标题</p>
  <div class="box"><span class="tag">章节</span><p>正文…</p>
    <div class="stat"><span>属性</span><span class="v">数值</span></div>
  </div>
  <div class="box"><span class="tag">下一节</span><p>正文…</p></div>
  <div class="foot"><span>来源</span><span>提示</span></div>
</div>
</body></html>
