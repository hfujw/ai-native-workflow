<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>杂志长图</title>
<style>
:root{--paper:#f7f4ee;--ink:#1c1a17;--muted:#8a857b;--accent:#b03a2e;--gold:#c9a227}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:Georgia,'Songti SC','Noto Serif SC',serif;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:64px 40px 96px}
.kicker{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
h1{font-size:42px;line-height:1.25;font-weight:700;margin-bottom:12px}
.lede{font-size:18px;color:var(--muted);margin-bottom:40px}
.rule{width:64px;height:3px;background:var(--gold);margin:32px 0}
h2{font-size:24px;margin:48px 0 16px;position:relative;padding-left:16px}
h2::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
p{margin-bottom:16px;font-size:16px}
blockquote{font-size:20px;font-style:italic;color:var(--accent);border-left:3px solid var(--gold);padding-left:20px;margin:32px 0}
.figure{background:#fff;border:1px solid #e5e0d6;padding:24px;margin:32px 0}
.figure .num{font-size:56px;font-weight:700;color:var(--accent)}
.figure .cap{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.1em}
.tl{position:relative;padding-left:28px;margin:24px 0}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#ddd}
.tl-item{position:relative;margin-bottom:24px}
.tl-item::before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl-year{font-weight:700;color:var(--accent);letter-spacing:.1em}
.tl-text{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.footer{font-size:12px;color:var(--muted);border-top:1px solid #e5e0d6;margin-top:64px;padding-top:16px}
</style></head>
<body>
<div class="wrap">
  <div class="kicker">专题</div>
  <h1>大标题</h1>
  <p class="lede">导语：一句话钩子</p>
  <p>正文…</p>
  <div class="rule"></div>
  <h2>章节标题</h2>
  <div class="tl"><div class="tl-item"><div class="tl-year">年份</div><div class="tl-text">事件</div></div></div>
  <div class="figure"><div class="num">关键数字</div><div class="cap">图注</div></div>
  <blockquote>金句引用</blockquote>
  <div class="grid2"><div>内容A</div><div>内容B</div></div>
  <div class="footer">来源与说明</div>
</div>
</body></html>
