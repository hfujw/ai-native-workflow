name: Frontend CI

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 依赖 webidl.util.markAsUncloneable（Node 22+ 才有的 API）——
          # Node 20 下 vitest 启动 jsdom worker 必崩，锁 22
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm test
      # 类型检查用 build 配置（排除 tests，与产物一致）——dev 配置含测试文件，非 CI 关口
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npm run build
